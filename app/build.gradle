plugins {
    id 'com.android.application'
}

def keystorePropertiesFile = project.file("keystore.properties")
def keystoreProperties = new Properties()

if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    dataBinding {
        enabled = true
    }
    compileSdk 35

    defaultConfig {
        applicationId "com.perez.revkiller"
        minSdk 23
        targetSdk 35
        versionName "Build 171"
        versionCode 171
        ndk {
            abiFilters "armeabi-v7a", "x86_64", "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                cppFlags ""
                abiFilters "armeabi-v7a", "x86_64", "arm64-v8a"
            }
        }
    }

    ndkVersion "26.1.10909125"

    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }

    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
        }
    }

    viewBinding {
        enabled = true
    }

    useLibrary 'org.apache.http.legacy'
    packagingOptions {
        jniLibs {
            excludes += ['OSGI-INF/*', 'OSGI-INF/*/*', 'lib/*-gpp/jni/*']
        }
        resources {
            excludes += ['META-INF/native/*', 'META-INF/DEPENDENCIES', 'META-INF/NOTICE', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE.txt', 'META-INF/BCKEY.DSA', 'META-INF/BCKEY.SF', 'META-INF/LICENSE.uas.txt', 'META-INF/INDEX.LIST', 'OSGI-INF/*', 'OSGI-INF/*/*', 'lib/*-gpp/jni/*', 'lib/*.jar']
        }
    }
    
    signingConfigs {
        release {
            def storeFilePath = keystoreProperties['storeFile']
            if (storeFilePath) {
                storeFile project.file(storeFilePath)
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        debug {
            initWith debug
            signingConfig signingConfigs.release
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release
        }
    }
    namespace 'com.perez.revkiller'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.databinding:databinding-runtime:8.7.0'
    implementation 'androidx.databinding:databinding-adapters:8.7.0'
    implementation 'androidx.gridlayout:gridlayout:1.1.0'
    implementation 'org.jsoup:jsoup:1.12.1'
    implementation 'org.slf4j:slf4j-api:1.7.10'
    implementation 'commons-io:commons-io:2.7'
    implementation 'com.github.bmelnychuk:atv:1.2.9'
    implementation 'com.fifesoft:rsyntaxtextarea:2.5.8'
    implementation 'uk.com.robust-it:cloning:1.9.2'
    implementation 'com.github.bumptech.glide:glide:4.14.0'
    implementation 'cat.ereza:customactivityoncrash:2.4.0'
    implementation 'org.vineflower:vineflower:1.10.1'
    implementation 'org.smali:baksmali:2.3.4'
    implementation 'org.smali:smali:2.3.4'
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'], exclude: [])
    implementation 'com.google.code.gson:gson:2.8.6'
    implementation 'com.google.guava:guava:28.2-jre'
    implementation 'io.reactivex:rxandroid:1.1.0'
    implementation 'io.reactivex:rxjava:1.1.0'
    implementation 'com.google.android.material:material:1.5.0'

    implementation 'com.squareup.okhttp3:okhttp:4.4.1'
    implementation group: 'org.apache.directory.studio', name: 'org.apache.commons.io', version: '2.4'
    implementation 'javax.annotation:jsr250-api:1.0'
    implementation 'com.fasterxml.jackson.core:jackson-core:2.7.6'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.7.6'
    implementation 'com.fasterxml.jackson.core:jackson-annotations:2.7.6'
    implementation 'org.bouncycastle:bcprov-jdk15on:1.70'
    implementation 'org.bouncycastle:bcpkix-jdk15on:1.70'
    implementation 'dnsjava:dnsjava:2.1.7'
    implementation 'com.google.guava:guava:27.0.1-android'
    implementation 'com.google.code.findbugs:jsr305:3.0.2'
    implementation 'com.google.jimfs:jimfs:1.1'
    implementation 'com.jcraft:jzlib:1.1.3'

    implementation 'org.slf4j:slf4j-log4j12:1.7.21'
    implementation 'net.gotev:uploadservice:3.3'
    implementation 'com.github.bumptech.glide:glide:3.7.0'
    implementation 'com.github.clans:fab:1.6.4'
    implementation 'com.google.code.gson:gson:2.14.0'
    implementation 'org.littleshoot:littleproxy:1.1.2'
    implementation 'org.conscrypt:conscrypt-openjdk-uber:2.7.0'
    // CameraX
    implementation "androidx.camera:camera-camera2:1.4.1"
    implementation "androidx.camera:camera-lifecycle:1.4.1"
    implementation "androidx.camera:camera-view:1.4.1"

    implementation "com.google.zxing:core:3.5.4"

    debugImplementation 'com.squareup.leakcanary:leakcanary-android:2.14'
}

repositories {
    mavenCentral()
}
